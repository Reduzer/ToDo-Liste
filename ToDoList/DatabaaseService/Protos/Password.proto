syntax = "proto3";

option csharp_namespace = "DatabaaseService";

service PasswordService{
	rpc CreatePassword(PasswordRequest) returns (PasswordResponse);
	rpc CheckPassword(PasswordRequest) returns (PasswordResponse);
	rpc UpdatePassword(PasswordRequest) returns (PasswordResponse);
}

message PasswordRequest{
	string sMessage = 1;
}

message PasswordResponse{
	string sMessage = 1;
	bool bBooleanValue = 2;
}